    remediation: Send a fully-qualified, URL-encoded absolute http(s) URL on `?url=`.
  - status: 400
    title: Missing text parameter
    description: 'Missing `?text=` parameter on a QR-code operation.'
    operations: ['GET /api/qr', 'GET /api/qrcode']
    remediation: Supply `?text=` with 1–2000 characters.
  - status: 400
    title: Missing or empty title
    description: 'Missing `?title=` on the OG image generator.'
    operations: ['GET /api/og-image']
    remediation: Supply `?title=`; optionally `?subtitle=`.
  - status: 400
    title: Missing URLs or over the batch limit
    description: No URLs supplied, or more than the 5-URL ceiling.
    operations: ['GET /api/batch']
