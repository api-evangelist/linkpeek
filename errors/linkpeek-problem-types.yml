    title: Daily rate limit exceeded
    description: >-
      Free-tier daily quota (100/day per IP) exhausted, or per-IP throttle tripped. Metered
      successful responses carry a `quota` object with `remaining` and `reset_iso` so a client can
      predict this before it happens.
    operations: ['GET /api/preview']
    remediation: >-
      Wait until `quota.reset_iso`, or attach a Trial/Pro key on `?key=` to lift the ceiling to
      50,000/day.
  - status: 502
    title: Failed to fetch the target URL
    description: The upstream page could not be retrieved or did not respond.
    operations:
      - 'GET /api/preview'
      - 'GET /api/favicon-extractor'
      - 'GET /api/meta-tag-parser'
      - 'GET /api/extract'
      - 'GET /api/metadata-full'
      - 'GET /api/favicons'
      - 'GET /api/headers'
    remediation: >-
