weaknesses:
  - >-
    The key is carried on the query string, so it is exposed to proxy logs, browser history and
    referrer headers. The spec documents no header alternative, although the live CORS policy
    advertises `X-API-Key` as an allowed request header.
  - >-
    No 401 or 403 response is documented for any operation, so an invalid or expired key has no
    published contract.
  - No scopes, no permissions model, no token expiry semantics beyond the 14-day trial window.
  - No OAuth 2.0, no OIDC, no mTLS. /.well-known/openid-configuration and /.well-known/oauth-authorization-server both returned 404.
