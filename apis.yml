  note: >-
    TWO DIFFERENT COMPANIES SHARE THE NAME LINKPEEK AND THIS RECORD HAD MERGED THEM. linkpeek.com is a Website
    Screenshot SaaS with paid plans; a separate, unrelated project submitted itself to apis.io/add repeatedly under the
    same name from 147.15.103.217.sslip.io -- a raw IP behind wildcard DNS, contact via an anonymous proton.me address.
    Because the intake gate keys on the submitted NAME, its artifacts were attached to this record. The description
    named linkpeek.com while all five harvested OpenAPIs declared servers: https://147.15.103.217.sslip.io:5000, and 34
    files across openapi/, collections/, skills/, mcp/, plans/, rate-limits/, security/ and llms/ referenced that host.
    A real business with paying customers was carrying a stranger's hobby API as its evidence. Everything derived from
    the sslip.io host has been removed. What remains is what linkpeek.com itself publishes, and every surviving URL was
    fetched and confirmed 200 against a control path that returns a real 404. linkpeek.com serves NO machine-readable
    artifacts of its own -- apis.json, openapi.json and llms.txt all 404 -- so this record is deliberately thin rather
    than falsely full.
