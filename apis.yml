x-identity-note: >-
  This repository currently profiles TWO unrelated organizations that share the name "LinkPeek",
  merged by a community submission on 2026-08-09. (1) LinkPeek.com — a commercial webpage
  screenshot service operating from New London, Connecticut since 2011 ("over 19 million
  screenshots served"), API at https://linkpeek.com/api/v1, plans $20–$180/month, maintainer
  Russell Ballestrini. (2) The "LinkPeek API" at 147.15.103.217.sslip.io — an MIT-licensed
  open-source Flask side project (github.com/dcn13l/hermes-autonomia, repository created
  2026-08-05) offering ~107 URL-utility routes on a $1/month Pro tier. Both were verified live on
  2026-08-09 and both are real; they are not the same provider, share no infrastructure, and
  should be split into separate catalog entries. Every artifact in this repository except the
  LinkPeek Screenshot API entry describes provider (2).

