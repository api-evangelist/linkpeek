openapi: 3.0.3

info:
  title: LinkPeek API
  description: |
    Free, open-source URL preview and QR code API. Turn any URL into a clean
    JSON link-preview card and any string into a QR code — no signup, no API
    key required for the free tier (100 requests/day per IP).

    77+ developer utility endpoints covering link previews, QR codes,
    favicons, meta tags, DNS, SSL, security checks, and developer tools.
    Built for Discord/Telegram/Slack bots, bookmark apps, social clients,
    and anyone who needs link metadata without signup friction.

    **Quickstart:**
    ```
    curl "https://147.15.103.217.sslip.io:5000/api/preview?url=https://github.com"
    ```

    **Pricing:**
    - **Free** — 100 req/day, no auth, just call the endpoint.
    - **Trial** — 50,000 req/day, free 14-day API key via `/api/key?email=`.
    - **Pro** — 50,000 req/day, $1/mo via `/api/subscribe?email=`.

    Pro keys work immediately; attach `?key=lp_pro_...` to any metered
    endpoint to lift the daily quota to 50,000.
  version: 1.19.1
  contact:
    name: LinkPeek
    url: https://github.com/dcn13l/hermes-autonomia
    email: linkpeek@example.com

servers:
  - url: https://147.15.103.217.sslip.io:5000
    description: Live production server

tags:
  - name: Link Preview
    description: URL metadata and link-card extraction
  - name: QR Code
    description: QR code generation (PNG and base64 JSON)
  - name: Favicon
    description: Favicon discovery and extraction
  - name: Meta Tags
    description: HTML head meta and link tag parsing
  - name: System
    description: Service health, status, and discovery

# ============================================================================
# Security — free tier needs no auth. Optional API key for Trial/Pro tiers.
# ============================================================================
security:
  - {}
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: query
      name: key
      description: |
        Optional API key for Trial/Pro tiers (lifts daily quota to 50,000).
        Obtain via `/api/key?email=` (free 14-day trial) or
        `/api/subscribe?email=` (Pro, $1/mo). Free tier requires no key.

  # ------------------------------------------------------------------
  # Reusable parameter and schema building blocks
  # ------------------------------------------------------------------
  parameters:
    UrlParam:
      name: url
      in: query
      required: true
      description: Target URL to analyze (must include http:// or https://).
      schema:
        type: string
        format: uri
        example: https://github.com

  schemas:
    # -- Errors ----------------------------------------------------------
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Machine-readable error code or human-readable message.
        url:
          type: string
          description: The URL that was attempted (when applicable).
        detail:
          type: string
          description: Additional context (varies by endpoint).
        max:
          type: integer
          description: Maximum allowed value when a limit is exceeded.
        got:
          type: integer
          description: The submitted value that exceeded the limit.

    # -- Quota -----------------------------------------------------------
    Quota:
      type: object
      description: Rate-limit usage info appended to metered responses.
      properties:
        plan:
          type: string
          enum: [free, trial, pro]
        limit:
          type: integer
          description: Daily request limit for the current plan.
        used:
          type: integer
          description: Requests consumed today.
        remaining:
          type: integer
          description: Requests remaining today.
        reset_iso:
          type: string
          format: date-time
          description: UTC ISO 8601 timestamp when the quota resets.

    # -- Preview ---------------------------------------------------------
    PreviewResponse:
      type: object
      properties:
        title:
          type: string
          description: Page title (from <title> or og:title).
        description:
          type: string
          description: Meta description or og:description.
        image:
          type: string
          format: uri
          description: Primary social image URL (og:image or twitter:image).
        site_name:
          type: string
          description: Site name from og:site_name.
        favicon:
          type: string
          format: uri
          description: Best favicon URL (resolved to absolute).
        url:
          type: string
          format: uri
          description: Final resolved URL (after redirects).
        quota:
          $ref: '#/components/schemas/Quota'

    # -- QR base64 JSON ---------------------------------------------------
    QrJsonResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        text:
          type: string
          description: The encoded text.
        ecc:
          type: string
          enum: [l, m, q, h]
          description: Error correction level used.
        size_bytes:
          type: integer
          description: PNG byte count.
        image:
          type: string
          description: Data URI — `data:image/png;base64,...`.
          example: data:image/png;base64,iVBORw0KGgo...
        quota:
          $ref: '#/components/schemas/Quota'

    # -- Favicon extractor ------------------------------------------------
    Icon:
      type: object
      properties:
        rel:
          type: string
          description: Link rel attribute (icon, apple-touch-icon, etc.).
        href:
          type: string
          format: uri
          description: Absolute icon URL.
        sizes:
          type: string
          description: Sizes attribute (e.g. "180x180").
        type:
          type: string
          description: MIME type (e.g. image/png).

    FaviconExtractorResponse:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: Final resolved URL.
        title:
          type: string
          description: Page <title> text.
        icon_count:
          type: integer
          description: Number of discovered icons.
        icons:
          type: array
          items:
            $ref: '#/components/schemas/Icon'
          description: All discovered icons in document order.
        best_guess:
          $ref: '#/components/schemas/Icon'
          description: The recommended icon (highest resolution apple-touch or largest).
        favicon_ico_fallback:
          type: boolean
          description: True if /favicon.ico was assumed (no link-rel icons found).
        quota:
          $ref: '#/components/schemas/Quota'

    # -- Meta-tag parser --------------------------------------------------
    MetaTag:
      type: object
      properties:
        key:
          type: string
          description: Normalized lookup key (name, property, or http-equiv).
        content:
          type: string
          description: Meta tag content attribute value.
        charset:
          type: string
          description: Charset attribute (if present).
        http_equiv:
          type: string
          description: http-equiv attribute (if present).
        property:
          type: string
          description: property attribute (for OG/Twitter tags).
        name:
          type: string
          description: name attribute (when key came from name).
        itemprop:
          type: string
          description: itemprop attribute (if present).

    LinkTag:
      type: object
      properties:
        rel:
          type: string
          description: Link rel attribute (canonical, manifest, alternate, etc.).
        href:
          type: string
          description: Link href attribute (as found in the document).
        type:
          type: string
          description: MIME type attribute (if present).
        sizes:
          type: string
          description: Sizes attribute (if present).
        media:
          type: string
          description: Media attribute (if present).
        hreflang:
          type: string
          description: hreflang attribute (if present).
        as:
          type: string
          description: preload/prefetch "as" attribute (if present).
        crossorigin:
          type: string
          description: crossorigin attribute (if present).

    MetaTagParserResponse:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: Final resolved URL.
        title:
          type: string
          description: Page <title> text.
        meta_count:
          type: integer
          description: Total number of meta tags.
        metas:
          type: array
          items:
            $ref: '#/components/schemas/MetaTag'
          description: Every meta tag in document order (includes duplicates).
        link_count:
          type: integer
          description: Total number of link tags.
        links:
          type: array
          items:
            $ref: '#/components/schemas/LinkTag'
          description: Every link tag (canonical, manifest, alternate, preload) in order.
        meta_summary:
          type: object
          additionalProperties:
            type: string
          description: Deduped key→content map (first occurrence wins) for quick lookup.
        canonical_url:
          type: string
          description: Canonical URL from <link rel="canonical"> (empty if absent).
        manifest_url:
          type: string
          description: Web app manifest URL from <link rel="manifest"> (empty if absent).
        quota:
          $ref: '#/components/schemas/Quota'

    # -- Status -----------------------------------------------------------
    RouteInfo:
      type: object
      properties:
        path:
          type: string
          description: URL path pattern.
        methods:
          type: array
          items:
            type: string
          description: Allowed HTTP methods.

    StatusResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        service:
          type: string
          example: LinkPeek
        version:
          type: string
          example: 1.19.1
        uptime_seconds:
          type: number
          description: Server uptime in seconds.
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/RouteInfo'
          description: Full list of registered API routes.
        free_daily_limit:
          type: integer
          example: 100
        pro_daily_limit:
          type: integer
          example: 50000
        docs:
          type: string
          example: /api/status
        health:
          type: string
          example: /api/health

    # -- Health -----------------------------------------------------------
    HealthResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        today:
          type: object
          properties:
            day:
              type: string
              description: Current day (YYYY-MM-DD).
            count:
              type: integer
              description: Total requests today.
        revenue:
          type: object
          properties:
            pro_price_usd:
              type: integer
              description: Monthly Pro price in USD.
            pay_method:
              type: string
              enum: [stripe, paypal, manual_email]
              description: Active payment method.
            subscribe_url:
              type: string
              description: Endpoint URL to subscribe to Pro.

    # -- OG image ---------------------------------------------------------
    OgImageResponse:
      type: string
      format: binary
      description: A 1200x630 PNG image (the canonical OG image size).

# ---------------------------------------------------------------------------
# Paths — the 7 most important endpoints (full detail) + secondary discovery
# ---------------------------------------------------------------------------
paths:
  /api/preview:
    get:
      tags: [Link Preview]
      summary: Link preview JSON
      description: |
        Fetches a URL, parses its HTML, and returns a clean JSON link-preview
        card (title, description, image, site_name, favicon). The primary
        endpoint for building link cards in bots and apps.

        **Free tier:** 100 req/day per IP, no key needed.
        **Pro tier:** 50,000 req/day — append `?key=lp_pro_...`.
      parameters:
        - $ref: '#/components/parameters/UrlParam'
      responses:
        '200':
          description: Link preview extracted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewResponse'
              example:
                title: "GitHub · Change is constant"
                description: "Where the world builds software."
                image: "https://github.githubassets.com/images/modules/open_graph/github-mark.png"
                site_name: "GitHub"
                favicon: "https://github.githubassets.com/favicons/favicon.svg"
                url: "https://github.com"
        '400':
          description: Missing or invalid URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Daily rate limit exceeded (free tier) or per-IP throttle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Failed to fetch the target URL (upstream error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/qr:
    get:
      tags: [QR Code]
      summary: Generate QR code PNG
      description: |
        Generates a QR code from the provided text and returns it as a PNG
        image (raw binary). Optional error correction, foreground, and
        background colour parameters.

        Returns `image/png` bytes — pipe to a file or embed directly.
      parameters:
        - name: text
          in: query
          required: true
          description: Text to encode (max 2000 chars).
          schema:
            type: string
            example: "https://example.com"
        - name: ecc
          in: query
          required: false
          description: Error correction level.
          schema:
            type: string
            enum: [l, m, q, h]
            default: m
        - name: fg
          in: query
          required: false
          description: Foreground colour (hex without #, e.g. 000000).
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{6}$'
            default: "000000"
        - name: bg
          in: query
          required: false
          description: Background colour (hex without #, e.g. ffffff).
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{6}$'
            default: "ffffff"
      responses:
        '200':
          description: QR code PNG image.
          content:
            image/png:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: '#/components/schemas/QrJsonResponse'
        '400':
          description: Missing `?text=` parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Text exceeds 2000 character limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/qrcode:
    get:
      tags: [QR Code]
      summary: Generate QR code as base64 JSON
      description: |
        Same QR generation as `/api/qr` but returns the PNG as a base64
        data URI inside a JSON envelope. Useful for JSON-only consumers
        (webhooks, serverless functions) that cannot consume raw binary.

        Query params identical to `/api/qr` (`text`, `ecc`, `fg`, `bg`).
      parameters:
        - name: text
          in: query
          required: true
          description: Text to encode (max 2000 chars).
          schema:
            type: string
            example: "https://example.com"
        - name: ecc
          in: query
          required: false
          schema:
            type: string
            enum: [l, m, q, h]
            default: m
        - name: fg
          in: query
          required: false
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{6}$'
            default: "000000"
        - name: bg
          in: query
          required: false
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{6}$'
            default: "ffffff"
      responses:
        '200':
          description: QR code as base64-encoded PNG inside JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrJsonResponse'
        '400':
          description: Missing `?text=` parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Text exceeds 2000 character limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/favicon-extractor:
    get:
      tags: [Favicon]
      summary: Discover all favicons from a URL
      description: |
        Parses a page's `<link>` tags and returns every favicon/icon found
        (apple-touch-icon, icon, shortcut icon, etc.) as structured JSON,
        with document order preserved. Includes a best-guess recommendation
        and a /favicon.ico fallback flag when no link-rel icons exist.
      parameters:
        - $ref: '#/components/parameters/UrlParam'
      responses:
        '200':
          description: Favicon extraction successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaviconExtractorResponse'
              example:
                url: "https://github.com"
                title: "GitHub · Where the world builds software"
                icon_count: 3
                icons:
                  - rel: "icon"
                    href: "https://github.githubassets.com/favicons/favicon.svg"
                    sizes: "any"
                    type: "image/svg+xml"
                  - rel: "apple-touch-icon"
                    href: "https://github.githubassets.com/apple-touch-icon.png"
                    sizes: "180x180"
                    type: ""
                best_guess:
                  rel: "apple-touch-icon"
                  href: "https://github.githubassets.com/apple-touch-icon.png"
                  sizes: "180x180"
                  type: ""
                favicon_ico_fallback: false
        '400':
          description: Missing or invalid URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Failed to fetch the target URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/meta-tag-parser:
    get:
      tags: [Meta Tags]
      summary: Comprehensive meta and link tag dump
      description: |
        Returns a loss-less structured dump of the `<head>` section — every
        `<meta>` tag AND every `<link>` tag in document order (including
        duplicates, http-equiv, charset, itemprop, and nameless tags that
        other endpoints discard). Also includes a deduped summary map,
        canonical URL, and manifest URL.

        Unlike `/api/meta-tags` (first-occurrence only, no link tags) and
        `/api/structured-data` (JSON-LD only), this endpoint preserves the
        full head structure.
      parameters:
        - $ref: '#/components/parameters/UrlParam'
      responses:
        '200':
          description: Meta and link tags extracted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaTagParserResponse'
              example:
                url: "https://github.com"
                title: "GitHub · Where the world builds software"
                meta_count: 42
                metas:
                  - key: "description"
                    content: "GitHub is where over 100 million developers..."
                    charset: ""
                    http_equiv: ""
                    property: ""
                    name: "description"
                    itemprop: ""
                  - key: "og:title"
                    content: "GitHub: Where the world builds software"
                    charset: ""
                    http_equiv: ""
                    property: "og:title"
                    name: ""
                    itemprop: ""
                link_count: 5
                links:
                  - rel: "canonical"
                    href: "https://github.com"
                    type: ""
                    sizes: ""
                    media: ""
                    hreflang: ""
                    as: ""
                    crossorigin: ""
                  - rel: "manifest"
                    href: "/manifest.json"
                    type: ""
                    sizes: ""
                    media: ""
                    hreflang: ""
                    as: ""
                    crossorigin: "use-credentials"
                meta_summary:
                  description: "GitHub is where over 100 million developers..."
                  "og:title": "GitHub: Where the world builds software"
                canonical_url: "https://github.com"
                manifest_url: "/manifest.json"
        '400':
          description: Missing or invalid URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Failed to fetch the target URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/status:
    get:
      tags: [System]
      summary: Service manifest and endpoint catalogue
      description: |
        Self-describing service manifest — returns the current version,
        uptime, and the full list of dynamically-registered API routes
        with their allowed methods. Unmetered (no rate limit). The
        canonical discovery endpoint for SDK clients and landing pages.
      responses:
        '200':
          description: Service status and route inventory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
              example:
                ok: true
                service: "LinkPeek"
                version: "1.19.1"
                uptime_seconds: 86412.5
                endpoints:
                  - path: "/api/preview"
                    methods: ["GET"]
                  - path: "/api/qr"
                    methods: ["GET"]
                  - path: "/api/status"
                    methods: ["GET"]
                free_daily_limit: 100
                pro_daily_limit: 50000
                docs: "/api/status"
                health: "/api/health"

  /api/health:
    get:
      tags: [System]
      summary: Health check
      description: |
        Lightweight health check. Returns service status, today's request
        count, and the active revenue/payment method. Suitable for
        uptime monitoring and load balancer health probes.
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                ok: true
                today:
                  day: "2026-08-09"
                  count: 1542
                revenue:
                  pro_price_usd: 1
                  pay_method: "paypal"
                  subscribe_url: "/api/subscribe?email=…"

  /api/og-image:
    get:
      tags: [Link Preview]
      summary: Generate placeholder OG image (1200x630 PNG)
      description: |
        Generates a 1200x630 PNG OpenGraph image (the canonical social
        share size) from a title and optional subtitle. Renders with a
        word-wrapped title, left brand accent bar, and optional subtitle
        in a faded weight. The PNG can be referenced directly by
        `<meta property="og:image">` or `<img src>`.

        Uses Pillow (PIL). Returns 503 if Pillow is not installed.
      parameters:
        - name: title
          in: query
          required: true
          description: Headline text (1-200 chars).
          schema:
            type: string
            maxLength: 200
            example: "Hello World"
        - name: subtitle
          in: query
          required: false
          description: Optional subtitle rendered smaller below the title (max 300 chars).
          schema:
            type: string
            maxLength: 300
            example: "A LinkPeek demo"
        - name: bg
          in: query
          required: false
          description: Hex background colour without # (default 1a1a2e).
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{6}$'
            default: "1a1a2e"
        - name: fg
          in: query
          required: false
          description: Hex foreground/title colour without # (default f5f5fa).
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{6}$'
            default: "f5f5fa"
        - name: accent
          in: query
          required: false
          description: Hex accent-bar colour without # (default 6366f1).
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{6}$'
            default: "6366f1"
      responses:
        '200':
          description: OG image PNG generated successfully.
          headers:
            Cache-Control:
              schema:
                type: string
                default: "public, max-age=86400"
            X-LinkPeek-Generated:
              schema:
                type: string
                default: "true"
          content:
            image/png:
              schema:
                $ref: '#/components/schemas/OgImageResponse'
        '400':
          description: Missing or empty `?title=`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Title exceeds 200 chars or subtitle exceeds 300 chars.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

# ===========================================================================
# Additional endpoints (summary-only). The full LinkPeek API has 77+ routes;
# call /api/status for the complete dynamically-registered list. Below are
# the most useful secondary endpoints, documented with minimal schema detail.
# ===========================================================================
  # -- Secondary link-preview endpoints --
  /api/extract:
    get:
      tags: [Link Preview]
      summary: Deeper crawl — raw meta + headings + links
      description: |
        Raw meta dict + up to 50 headings + 100 links. A deeper HTML crawl
        than `/api/preview` (collects body content). Same query/params.
      parameters:
        - $ref: '#/components/parameters/UrlParam'
      responses:
        '200':
          description: Extracted metadata with headings and links.
          content:
            application/json:
              schema:
                type: object
                description: Includes title, meta{}, headings[], links[], favicon, quota.
        '400':
          description: Missing or invalid URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Fetch failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/metadata-full:
    get:
      tags: [Link Preview]
      summary: Full metadata dump (every meta tag)
      description: Returns every meta tag found in the head, plus title,
        favicon, raw favicon, response headers, and head HTML length.
      parameters:
        - $ref: '#/components/parameters/UrlParam'
      responses:
        '200':
          description: Full metadata dump.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
                  title:
                    type: string
                  favicon:
                    type: string
                    format: uri
                  raw_favicon:
                    type: string
                  meta:
                    type: object
                    description: All meta tags as key→value (multi-valued keys preserved).
                  response_headers:
                    type: object
                  head_html_length:
                    type: integer
                  quota:
                    $ref: '#/components/schemas/Quota'
        '400':
          description: Missing or invalid URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Fetch failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/batch:
    get:
      tags: [Link Preview]
      summary: Batch link previews (up to 5 URLs)
      description: |
        Fetches link previews for up to 5 URLs in parallel (12s timeout).
        Returns an array of preview objects.
      parameters:
        - name: urls
          in: query
          required: true
          description: Comma-separated list of up to 5 URLs.
          schema:
            type: string
            example: "https://github.com,https://news.ycombinator.com"
      responses:
        '200':
          description: Batch preview results.
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/PreviewResponse'
        '400':
          description: Missing URLs or exceeding the 5-URL limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # -- Secondary favicon/headers endpoints --
  /api/favicons:
    get:
      tags: [Favicon]
      summary: Proxy favicon image bytes
      description: Returns the raw favicon image bytes for a URL (proxied
        to avoid CORS issues in browser clients).
      parameters:
        - $ref: '#/components/parameters/UrlParam'
      responses:
        '200':
          description: Favicon image bytes.
          content:
            image/*:
              schema:
                type: string
                format: binary
        '400':
          description: Missing or invalid URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Fetch failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/headers:
    get:
      tags: [Link Preview]
      summary: HTTP response headers only
      description: Returns only the HTTP response headers for a URL
        (no HTML parsing).
      parameters:
        - $ref: '#/components/parameters/UrlParam'
      responses:
        '200':
          description: Response headers object.
          content:
            application/json:
              schema:
                type: object
                properties:
                  final_url:
                    type: string
                    format: uri
                  status:
                    type: integer
                  headers:
                    type: object
                    description: Header name → value(s).
        '400':
          description: Missing or invalid URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Fetch failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # -- API key and billing endpoints --
  /api/key:
    get:
      tags: [System]
      summary: Issue a 14-day trial API key
      description: |
        Issues a free 14-day trial API key (50,000 req/day), returned in
        the JSON response. No payment required.
      parameters:
        - name: email
          in: query
          required: true
          description: Email address to associate with the trial key.
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Trial key issued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_key:
                    type: string
                    description: Trial API key (e.g. lp_trial_...).
                  plan:
                    type: string
                    example: trial
                  trial_days:
                    type: integer
                    example: 14
                  expires:
                    type: string
                    format: date-time
        '400':
          description: Missing or invalid email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/subscribe:
    get:
      tags: [System]
      summary: Subscribe to Pro ($1/mo) and mint a Pro API key
      description: |
        Mints a Pro API key (50,000 req/day, never expires) and returns
        a self-serve payment link (Stripe, PayPal, or manual email).
        The key works immediately — `paid:false` is a reconciliation flag
        the operator flips to true when the PayPal/Stripe notification arrives.
      parameters:
        - name: email
          in: query
          required: true
          description: Email address for the Pro account.
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Pro key minted with payment instructions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_key:
                    type: string
                    description: Pro API key (e.g. lp_pro_...).
                  pay_url:
                    type: string
                    format: uri
                    description: Payment link (Stripe/PayPal/mailto).
                  pay_method:
                    type: string
                    enum: [stripe, paypal, manual_email]
                  price_usd:
                    type: integer
                    example: 1
                  instructions:
                    type: string
        '400':
          description: Missing or invalid email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/health/json:
    get:
      tags: [System]
      summary: Machine-friendly health (fixed structure)
      description: |
        Fixed-structure health check omitting human-readable adapters
        (currency symbols, subscribe_url). Returns ok, version, uptime,
        today's count, now_iso, and endpoint_count.
      responses:
        '200':
          description: Machine-friendly health info.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  service:
                    type: string
                  version:
                    type: string
                  uptime_seconds:
                    type: number
                  today:
                    type: object
                    properties:
                      day:
                        type: string
                      count:
                        type: integer
                  now_iso:
                    type: string
                    format: date-time
                  free_daily_limit:
                    type: integer
                  pro_daily_limit:
                    type: integer
                  endpoint_count:
                    type: integer
