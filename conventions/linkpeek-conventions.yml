generated: '2026-08-09'
method: searched
source: >-
  https://147.15.103.217.sslip.io/openapi.yaml, live response headers from
  https://147.15.103.217.sslip.io/api/preview, https://147.15.103.217.sslip.io/api/pricing, and
  the provider README at https://github.com/dcn13l/hermes-autonomia
authentication:
  style: api-key-in-query
  parameter: key
  scheme: ApiKeyAuth
  optional: true
  note: >-
    The free tier is anonymous — no key, no signup, metered per source IP. A key is only needed to
    lift the daily ceiling. Keys are issued self-serve at `/api/key?email=` (14-day trial) or
    `/api/subscribe?email=` (Pro). Pro keys carry an `lp_pro_` prefix per the spec description.
  cross_reference: authentication/linkpeek-authentication.yml
  weakness: >-
    A secret on the query string is logged by proxies, browser history and referrer headers. There
    is no header-based alternative documented.
idempotency:
  supported: false
  note: >-
    No idempotency-key header, parameter or contract is documented anywhere in the spec, the
    README, or the live response headers. Every documented operation is a `GET`, so the read paths
    are naturally idempotent, but the two state-changing operations that matter —
    `GET /api/key?email=` and `GET /api/subscribe?email=` — mint keys over `GET` with no
    de-duplication contract, which is the opposite of an idempotency guarantee.
  cross_reference: null
pagination:
  supported: false
  note: >-
    No collection endpoint in the documented spec paginates. `/api/batch` caps at 5 URLs per call
    and returns them all; `/api/sitemap-parse` is documented in the README as capped at 500 URLs.
    There is no cursor, offset, limit or page parameter anywhere.
field_expansion:
  supported: false
  note: >-
    No sparse-fieldset or expansion parameter. Depth is chosen by picking a different endpoint —
    `/api/preview` (card) vs `/api/extract` (meta + headings + links) vs `/api/metadata-full`
    (every meta tag).
metadata:
  supported: false
request_tracing:
  request_id_header: null
  note: >-
    No `X-Request-Id`, correlation or trace header is emitted. Observed response headers on
    2026-08-09 were Server, Date, Content-Type, Content-Length, Connection,
    X-Content-Type-Options, X-Frame-Options, three Access-Control-Allow-* headers, plus two
    vanity headers (`X-Support`, `X-Pricing`).
versioning:
  scheme: none-in-path
  note: >-
    The API is unversioned at the transport level — paths are `/api/<resource>` with no version
    segment. The build version is reported in-band at `GET /api/status` (`version`, 1.28.0 on
    2026-08-09) and in the spec's `info.version` (1.19.1). There is no way for a client to pin a
    version, and no versioning policy is published.
  cross_reference: lifecycle/linkpeek-lifecycle.yml
  caveat: >-
    `/v1/chat/completions` and `/v1/models` carry a `v1` segment only because they mimic the
    OpenAI wire format; that `v1` is not a LinkPeek API version.
error_envelope:
  format: custom-json
  shape: '{error, url, detail, max, got}'
  rfc9457: false
  cross_reference: errors/linkpeek-problem-types.yml
rate_limit_signaling:
  headers: []
  in_body: true
  body_field: quota
  body_shape: '{plan, limit, used, remaining, reset_iso}'
  exhausted_status: 429
  note: >-
    Quota state is returned in the response BODY, not in headers — there is no `RateLimit-Limit`,
    `RateLimit-Remaining`, `Retry-After` or `X-RateLimit-*` header on any observed response. A
    client that only inspects headers is blind to its own quota, and a `429` carries no
    `Retry-After` telling it when to come back; the reset time is only visible on the *successful*
    responses that preceded it.
  cross_reference: rate-limits/linkpeek-rate-limits.yml
cors:
  enabled: true
  allow_origin: '*'
  allow_methods: [GET, POST, OPTIONS]
  allow_headers: [Content-Type, X-Webhook-Secret, X-API-Key]
  note: >-
    `X-API-Key` is advertised as an allowed request header even though the published spec only
    accepts the key on the query string. Browser clients may be able to send it; it is not
    documented.
security_headers:
  x_content_type_options: nosniff
  x_frame_options: DENY
  hsts: false
  note: HSTS is absent on both hosts (see security/linkpeek-domain-security.yml).
content_negotiation:
  note: >-
    Media type is chosen by endpoint, not by `Accept` — `/api/qr` always returns `image/png` while
    `/api/qrcode` returns the same payload as base64 JSON, and `/api/health` vs
    `/api/health/json` split the same way.
ssrf_policy:
  documented: true
  source: 'https://github.com/dcn13l/hermes-autonomia README, "Security hardening"'
  note: >-
    Private, loopback and cloud-metadata addresses are blocklisted for every URL-fetching
    operation. Agents should expect a 502 rather than a fetch for internal targets.
